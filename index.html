<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2306070d'/%3E%3Crect x='4' y='4' width='24' height='24' rx='4' fill='none' stroke='%2300f5ff' stroke-width='2.5'/%3E%3Cpath d='M10 22V10l12 12V10' fill='none' stroke='%23ff2a85' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>霓虹街区 · Neon Street Block</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #06070d;
        color: #f3f6fc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #06070d;
      }

      #neon-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #ui-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="neon-canvas"></canvas>
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/web/main.ts"></script>
  </body>
</html>
